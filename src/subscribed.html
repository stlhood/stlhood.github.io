<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telepath</title>
  <meta name="description" content="Telepath is reimagining the personal computing experience from first principles for the AI era.">
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Telepath" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta property="og:url" content="https://telepath.computer">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Telepath">
  <meta property="og:description" content="Telepath is reimagining the personal computing experience from first principles for the AI era.">
  <meta property="og:image" content="https://telepath.computer/telepath-logo-og.png">
  <meta property="og:logo" content="https://telepath.computer/telepath-logo-og.png" />
  <meta name="twitter:card" content="summary_large_image">
  <meta property="twitter:domain" content="telepath.computer">
  <meta property="twitter:url" content="https://telepath.computer">
  <meta name="twitter:title" content="Telepath">
  <meta name="twitter:description" content="Telepath is reimagining the personal computing experience from first principles for the AI era.">
  <meta name="twitter:image" content="https://telepath.computer/telepath-logo-og.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Esteban&family=IBM+Plex+Sans+Condensed:wght@700&display=swap" rel="stylesheet">
  <style>

    :root {
      --blurb-font-size: 1.5rem;
      --blurb1-font-size: 2rem;
      --blurb-line-height: 1.6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      background: #1a1a1e;
      color: #ffffff;
      font-family: "Esteban", serif;
    }

    /* Hide UI elements until JS initializes */
    body.not-ready #header,
    body.not-ready #down-arrow,
    body.not-ready .blurb,
    body.not-ready .blurb-display,
    body.not-ready #manifesto {
      opacity: 0 !important;
    }


    /* Header bar - spans full width, contains wordmark */
    #header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 1.5rem;
      z-index: 100;
    }
    /* Header bar background/border - opacity controlled by --header-bar-opacity */
    #header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #1a1a1e;
      border-bottom: 1px solid #444;
      opacity: var(--header-bar-opacity, 0);
      z-index: -1;
    }
    /* Gradient fade below header */
    #header::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(to bottom, #1a1a1e, transparent);
      pointer-events: none;
      opacity: var(--header-bar-opacity, 0);
    }
    /* Wordmark - clickable text only */
    #wordmark {
      font-family: "IBM Plex Sans Condensed", sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      cursor: pointer;
      color: inherit;
      text-decoration: none;
    }

    /* manifesto page content */
    #manifesto {
      position: relative;
      padding: 0 8vw;
      max-width: 70em;
      margin: 0 auto;
      z-index: 60;
      font-weight: 400;
      /* center content in the final page, ensure it's a full page which also ensures the jenga tower fades out */
      min-height: 90vh; /* approx 90 due to header */
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    #manifesto h1 {
      font-size: 3rem;
      margin-bottom: 2rem;
      text-align: center;
    }
    #manifesto p {
      font-size: 1.2rem;
      line-height: 1.8;
      margin-bottom: 1.5rem;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    #manifesto a {
      color: #7cb3ff;
      text-decoration: none;
    }
    #manifesto a:hover {
      text-decoration: underline;
    }

    /* ==========================================================================
       RESPONSIVE STYLES

       Geometry styles (width, padding, margin) must match between anchor blurbs
       and display blurbs to ensure consistent text wrapping and sizing.
       ========================================================================== */

    /* ********* LARGE *********** */
    @media (min-width: 901px) {
      :root {
        --blurb-font-size: 2.2rem;
        --blurb1-font-size: 2.2rem;
      }
      #canvas-container canvas {
        /* tower goes to the left half the screen instead of centered. */
        left: 25%; /* from 50% */
      }
      /* Blurb geometry */
      #blurb2, #blurb3, #blurb5,
      #blurb2-display, #blurb3-display, #blurb5-display {
      }
      #manifesto p {
        font-size: 1.3rem;
      }
    }

    /* ********* TABLET *********** */
    @media (min-width:601px) and (max-width: 900px) {
      #canvas-container canvas {
        /* tower goes to the left half the screen instead of centered. */
        left: 25%; /* from 50% */
      }
      /* Blurbs 2, 3, 5 geometry */
      #blurb2, #blurb3, #blurb5,
      #blurb2-display, #blurb3-display, #blurb5-display {
      }
    }

    /* ********* MAX PHONE *********** */
    @media (min-width:401px) and (max-width: 600px) {
      #canvas-container canvas {
      }
      /* Blurb 1 geometry */
      #blurb1,
      #blurb1-display {
      }
      #blurb1-display {
      }
      /* Blurbs 2, 3, 5 geometry */
      #blurb2, #blurb3, #blurb5,
      #blurb2-display, #blurb3-display, #blurb5-display {
        left: 5vw;
        right: 5vw;
        width: 90vw;
        text-align: center;
        padding: 4vw;
      }
      #blurb2-display, #blurb3-display, #blurb5-display {
        background-color: rgba(0,0,0,0.3);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 30px;
      }
      /* Signup form */
      .signup-form form {
        flex-direction: column;
        align-items: stretch;
      }
      .signup-form input[type="email"] {
        max-width: none;
      }
    }

    /* ********* NORMAL PHONE *********** */
    @media (max-width: 400px) {
      :root {
        --blurb-font-size: 1.6rem;
        --blurb1-font-size: 1.6rem;
      }
      #canvas-container canvas {
        /* no changes, tower remains centered. */
      }
      /* Blurb 1 geometry */
      #blurb1,
      #blurb1-display {
      }
      /* Blurbs 2, 3, 5 centered geometry */
      #blurb2, #blurb3, #blurb5,
      #blurb2-display, #blurb3-display, #blurb5-display {
        left: 5vw;
        right: 5vw;
        width: 90vw;
        text-align: center;
        padding: 4vw;
      }
      /* Display-only visual styles */
      #blurb2-display, #blurb3-display, #blurb5-display {
        background-color: rgba(0,0,0,0.3);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 30px;
      }
    }
  </style>
  <script type="module" src="index.js"></script>
</head>
<body>
  <header id="header"><a id="wordmark" href="/">TELEPATH</a></header>

  <!-- Canvas - completely separate from page layout (position: fixed) -->
  <div id="canvas-container"></div>

  <!-- manifesto: Normal page content -->
  <div id="manifesto">
      <p style="text-align: center;">Thanks for joining the Telepath waitlist.</p>
      <p style="text-align: center;"><strong>Please check your email for a confirmation link.</strong></p>

      <p><a href="https://telepath.computer">Visit our homepage.</a></p>

  </div>

</body>
</html>
