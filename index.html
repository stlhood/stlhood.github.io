<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Telepath</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('assembly-line.jpg');
      background-size: cover;
      background-position: center;
      opacity: 1.0;
      filter: brightness(50%);
      z-index: -1;
    }

    .content {
      z-index: 1;
    }

    .bgimage {
      position: fixed;
      top: 1rem;
      left: 1rem;
      width: 100%;
      max-width: 30vw;
      min-width: 400px;
      height: auto;
      z-index: 2;
      transform: none;
    }

    @media (max-width: 800px) {
      .bgimage {
        left: 50%;
        transform: translateX(-50%);
      }
    }
  </style>
</head>
<body>
  <div class="background"></div>
  <div class="content">
    <img class="bgimage" src="./telepath-logo-inverted.png" alt="Telepath">
  </div>
</body>
<!-- Building something new. -->
</html>
