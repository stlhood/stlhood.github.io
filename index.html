<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Telepath</title>
    <meta name="description" content="Building something new.">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Telepath" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:url" content="https://telepath.computer">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Telepath">
    <meta property="og:description" content="Building something new.">
    <meta property="og:image" content="https://telepath.computer/telepath-logo-og.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta property="twitter:domain" content="telepath.computer">
    <meta property="twitter:url" content="https://telepath.computer">
    <meta name="twitter:title" content="Telepath">
    <meta name="twitter:description" content="Building something new.">
    <meta name="twitter:image" content="https://telepath.computer/telepath-logo-og.png">
    <style>
      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      .background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-image: url('assembly-line.jpg');
        background-size: cover;
        background-position: center;
        opacity: 1.0;
        filter: brightness(50%);
        z-index: -1;
      }

      .content {
        z-index: 1;
      }

      .bgimage {
        position: fixed;
        top: 1rem;
        left: 1rem;
        width: 100%;
        max-width: 30vw;
        min-width: 400px;
        height: auto;
        z-index: 2;
        transform: none;
      }

      @media (max-width: 800px) {
        .bgimage {
          left: 50%;
          transform: translateX(-50%);
        }
      }
    </style>
  </head>
  <body>
    <div class="background"></div>
    <div class="content">
      <img class="bgimage" src="./telepath-logo-inverted.png" alt="Telepath">
    </div>
  </body>
  <!-- Building something new. -->
