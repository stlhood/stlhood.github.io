<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jenga Animation Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      background: #1a1a2e;
    }
    canvas {
      display: block;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: monospace;
      font-size: 14px;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 4px;
    }
    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-family: monospace;
      background: rgba(0,0,0,0.5);
      padding: 10px 20px;
      border-radius: 4px;
    }
    input[type="range"] {
      width: 300px;
    }
    #dropzone {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: monospace;
      font-size: 18px;
      text-align: center;
      padding: 40px;
      border: 2px dashed #666;
      border-radius: 10px;
    }
  </style>
  <script type="module" crossorigin src="./assets/player-CvllCSRq.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="./assets/three.module-BX2Vlr8r.js">
  <link rel="modulepreload" crossorigin href="./assets/OrbitControls-CVpFRKhC.js">
  <link rel="modulepreload" crossorigin href="./assets/LineSegmentsGeometry-CRWMkwAp.js">
  <link rel="modulepreload" crossorigin href="./assets/LineMaterial-BlWp_R06.js">
  <link rel="modulepreload" crossorigin href="./assets/LineSegments2-DJzywQPs.js">
</head>
<body>
  <div id="info">Jenga Animation Player</div>
  <div id="dropzone">Drop jenga-animation.json here<br>or click to select</div>
  <div id="controls" style="display:none;">
    <input type="range" id="scrubber" min="0" max="100" value="0">
    <span id="frameInfo">Frame: 0 / 0</span>
  </div>
</body>
</html>
